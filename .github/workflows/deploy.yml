
name: Deploy TGProxy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "telegram_webproxy.js"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create temporary Wrangler config
        run: |
          cat > wrangler.toml <<'EOF'
          name = "tgproxy-hsnrhebd"
          main = "telegram_webproxy.js"
          compatibility_date = "2026-10-09"
          EOF

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            SECRET
            BOOT
        env:
          SECRET: ${{ secrets.TGPROXY_SECRET }}
          BOOT: ${{ secrets.TGPROXY_BOOT }}
